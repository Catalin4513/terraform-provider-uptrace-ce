# Terraform Provider release workflow.
#
# This workflow builds and publishes a release when a new tag matching v* is
# pushed. It uses the HashiCorp goreleaser action to produce archives in the
# format that registry.terraform.io expects.
#
# Prerequisites:
#   1. Generate a GPG signing key and add the armor-exported private key as the
#      GPG_PRIVATE_KEY secret, and its passphrase as PASSPHRASE.
#   2. Ensure GITHUB_TOKEN has contents:write permission (default for tags).
#
# See: https://developer.hashicorp.com/terraform/registry/providers/publishing
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
